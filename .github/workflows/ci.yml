name: NivaaroFix Monorepo CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Test & Validate Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: nivaarofix_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm --prefix backend install
          npm --prefix Dashboard install
          npm --prefix WebLogin install

      - name: Build Production Frontend Bundles (Vite)
        run: |
          npm run build:all

      - name: Initialize PostgreSQL Schema & Tables
        run: |
          npm run db:reset
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: root
          PG_DATABASE: nivaarofix_db

      - name: Start Backend API & Run All Test Suites
        run: |
          node backend/src/server.js &
          node -e "
            async function wait() {
              for (let i = 0; i < 30; i++) {
                try {
                  const res = await fetch('http://127.0.0.1:5000/api/health');
                  if (res.ok) { console.log('Backend API is healthy on port 5000'); return; }
                } catch {}
                await new Promise(r => setTimeout(r, 1000));
              }
              throw new Error('Backend failed to boot');
            }
            wait();
          "
          npm run test:all
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: root
          PG_DATABASE: nivaarofix_db
          PORT: 5000
