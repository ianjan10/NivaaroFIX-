name: NivaaroFix Monorepo CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Test & Validate Monorepo
    runs-on: ubuntu-latest

    env:
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: root
      PG_DATABASE: nivaarofix_db
      PORT: 5000
      NODE_OPTIONS: "--dns-result-order=ipv4first"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: nivaarofix_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm --prefix backend install
          npm --prefix Dashboard install
          npm --prefix WebLogin install

      - name: Build Production Frontend Bundles (Vite)
        run: |
          npm run build:all

      - name: Initialize PostgreSQL Schema & Tables
        run: |
          npm run db:reset

      - name: Run Backend Marketplace & Spatial Dispatch Tests
        run: |
          npm --prefix backend test
          node --max-old-space-size=2048 backend/tests/gps_dispatch_quotation_e2e.test.mjs

      - name: Start Backend REST API
        run: |
          node backend/src/server.js &
          node -e "
            async function check() {
              for (let i = 0; i < 30; i++) {
                try {
                  const res = await fetch('http://127.0.0.1:5000/api/health');
                  if (res.ok) { console.log('✅ Backend API is healthy on port 5000'); process.exit(0); }
                } catch {}
                await new Promise(r => setTimeout(r, 1000));
              }
              console.error('❌ Backend failed to start');
              process.exit(1);
            }
            check();
          "

      - name: Run Master System Health & OAuth Tests
        run: |
          node tests/system_health.test.mjs
          node --max-old-space-size=2048 backend/tests/postgres_crud.test.mjs
          node --max-old-space-size=2048 backend/tests/oauth.test.mjs
          node --max-old-space-size=2048 backend/tests/real_booking_flow.test.mjs

      - name: Run Dashboard Marketplace & QA Suites
        run: |
          npm --prefix Dashboard test

      - name: Run WebLogin Authentication & Job-Lock Suites
        run: |
          npm --prefix WebLogin test
