<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  
  <!-- Roof: clean gable angle, rounded apex, plumb cut eaves -->
  <path d="
    M 28 100 
    L 28 85 
    L 116 33 
    Q 120 30.5 124 33 
    L 212 85 
    L 212 100 
    L 124 48 
    Q 120 46 116 48 
    Z
  " fill="#FFFFFF"/>
  
  <!-- Monogram N + F -->
  <!-- Left stem -->
  <rect x="66" y="92" width="14" height="92" fill="#FFFFFF"/>
  
  <!-- Diagonal of N (miters flush at top-left and bottom-right) -->
  <polygon points="66,92 80,92 138,184 124,184" fill="#FFFFFF"/>
  
  <!-- Right stem of N / Spine of F -->
  <rect x="124" y="92" width="14" height="92" fill="#FFFFFF"/>
  
  <!-- F Top Arm -->
  <rect x="138" y="92" width="36" height="14" fill="#FFFFFF"/>
  
  <!-- F Middle Bar -->
  <rect x="138" y="134" width="28" height="13.5" fill="#FFFFFF"/>
  
</svg>